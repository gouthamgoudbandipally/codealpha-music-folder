<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WaveFlow — Music Player</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="16" r="3"/>
          </svg>
        </div>
        <h1>WaveFlow</h1>
      </div>

      <div class="sidebar-section">
        <h2>Playlist</h2>
        <ul id="playlist" class="playlist" aria-label="Song playlist"></ul>
      </div>

      <div class="sidebar-footer">
        <label class="toggle autoplay-toggle">
          <input type="checkbox" id="autoplayToggle" checked>
          <span class="toggle-track"></span>
          <span class="toggle-label">Autoplay next</span>
        </label>
      </div>
    </aside>

    <main class="player-main">
      <div class="album-art-wrap">
        <div class="album-art" id="albumArt">
          <div class="vinyl-ring"></div>
          <div class="vinyl-center">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
            </svg>
          </div>
        </div>
        <div class="visualizer" id="visualizer" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>

      <div class="track-info">
        <p class="track-label">Now Playing</p>
        <h2 id="songTitle" class="song-title">Select a song</h2>
        <p id="artistName" class="artist-name">—</p>
      </div>

      <div class="progress-section">
        <div class="progress-bar-wrap">
          <input
            type="range"
            id="progressBar"
            class="progress-bar"
            min="0"
            max="100"
            value="0"
            aria-label="Seek"
          >
        </div>
        <div class="time-display">
          <span id="currentTime">0:00</span>
          <span id="totalDuration">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button id="prevBtn" class="control-btn" aria-label="Previous track" title="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6V6zm3.5 6l8.5 6V6l-8.5 6z"/></svg>
        </button>
        <button id="playPauseBtn" class="control-btn play-btn" aria-label="Play" title="Play">
          <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7L8 5z"/></svg>
          <svg class="icon-pause hidden" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button id="nextBtn" class="control-btn" aria-label="Next track" title="Next">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2.5-6l8.5 6V6l-8.5 6zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>

      <div class="volume-section">
        <button id="muteBtn" class="volume-icon-btn" aria-label="Mute" title="Mute">
          <svg class="icon-volume" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
          </svg>
          <svg class="icon-muted hidden" viewBox="0 0 24 24" fill="currentColor">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.2-.38 2.31-1.02 3.28-1.86L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
          </svg>
        </button>
        <input
          type="range"
          id="volumeBar"
          class="volume-bar"
          min="0"
          max="100"
          value="80"
          aria-label="Volume"
        >
        <span id="volumeValue" class="volume-value">80%</span>
      </div>
    </main>
  </div>

  <audio id="audio" preload="metadata"></audio>
  <script src="player.js"></script>
</body>
</html>
